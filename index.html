<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOU Dispatch Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#14305F; --ink-soft:#3C5688; --muted:#5F7399;
    --blue:#1F4FBF; --blue-mid:#4C7BE0; --blue-soft:#DCE7FA; --blue-faint:#EBF1FC;
    --panel:rgba(250,252,255,0.94); --line:#D3DEF3;
    --amber:#A8650F; --amber-soft:#FBEBD0; --red:#B3392F; --red-soft:#F8DCD8;
  }
  *{box-sizing:border-box;}
  body{margin:0;color:var(--ink);font-family:'Inter',Arial,sans-serif;min-height:100vh;
       background:linear-gradient(180deg,#D9E6FB 0%,#E8F0FD 40%,#F3F7FE 100%) fixed;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 24px 72px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);}
  h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;color:var(--ink);}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
          background:rgba(255,255,255,0.85);border:1px solid var(--line);border-radius:18px;padding:14px 22px;
          box-shadow:0 8px 28px rgba(31,79,191,0.07);margin-bottom:22px;}
  h1{font-size:1.45rem;margin:2px 0 0;font-weight:700;letter-spacing:-0.01em;}
  .meta{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--muted);line-height:1.6;}
  button#refresh{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;background:var(--blue);color:#fff;border:none;padding:7px 14px;border-radius:9px;cursor:pointer;margin-top:4px;}
  button#refresh:hover{background:var(--ink);}
  .notice{background:var(--amber-soft);color:var(--amber);border:1px solid #EBCB97;border-radius:12px;padding:11px 16px;font-size:0.82rem;margin-bottom:18px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:26px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{font-family:'Inter',sans-serif;font-size:0.84rem;font-weight:600;background:rgba(255,255,255,0.7);border:1px solid var(--line);color:var(--ink-soft);padding:9px 18px;border-radius:11px;cursor:pointer;}
  .tab-btn:hover{border-color:var(--blue-mid);}
  .tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .filters .f{display:flex;align-items:center;gap:6px;}
  .filters label{font-size:0.64rem;letter-spacing:0.12em;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .filters select{font-family:'Inter',sans-serif;font-size:0.8rem;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
  .view{display:none;} .view.active{display:block;}
  section{margin-bottom:38px;}
  section > .eyebrow{margin-bottom:2px;}
  h2{font-size:1.2rem;font-weight:600;margin:0 0 14px;}
  .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 20px rgba(31,79,191,0.05);}
  .kpi .grade{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;}
  .kpi .achv{font-family:'Source Serif 4',Georgia,serif;font-size:1.75rem;font-weight:700;margin:6px 0 2px;color:var(--ink);}
  .kpi .figs{font-size:0.76rem;color:var(--muted);}
  .kpi.overall{background:linear-gradient(135deg,#14305F,#1F4FBF);border-color:#14305F;}
  .kpi.overall .grade,.kpi.overall .figs{color:#BFD0F5;}
  .kpi.overall .achv{color:#fff;}
  .chart-row{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(31,79,191,0.05);}
  .panel h3{font-size:0.98rem;margin:0 0 8px;font-weight:600;}
  .panel canvas{max-height:260px;}
  .table-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .period-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  table{width:100%;border-collapse:collapse;font-size:0.83rem;}
  th{text-align:left;font-weight:600;font-size:0.68rem;letter-spacing:0.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 5px;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--blue);}
  td{padding:8px 5px;border-bottom:1px solid #E4ECF9;}
  td.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;}
  .tbl-scroll{overflow-x:auto;}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;white-space:nowrap;}
  .pill.good{background:var(--blue-soft);color:var(--blue);}
  .pill.warn{background:var(--amber-soft);color:var(--amber);}
  .pill.bad{background:var(--red-soft);color:var(--red);}
  .pill.neutral{background:var(--blue-faint);color:var(--muted);}
  .dq-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dq-item{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid #E4ECF9;font-size:0.83rem;}
  .dq-item .name{font-weight:500;}
  .dq-item .tag{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--muted);white-space:nowrap;}
  .empty-note{color:var(--muted);font-size:0.83rem;font-style:italic;padding:8px 4px;}
  .more-note,.count-note{color:var(--muted);font-size:0.76rem;}
  .count-note{margin-bottom:10px;}
  .more-note{padding-top:6px;}
  .err{background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:12px;padding:14px;font-size:0.85rem;}
  .loading{color:var(--muted);padding:40px 0;text-align:center;}
  .search-box{margin-bottom:12px;}
  .search-box input{width:100%;max-width:320px;font-family:'Inter',sans-serif;font-size:0.83rem;padding:8px 11px;border:1px solid var(--line);border-radius:9px;}
  .metric{display:flex;justify-content:space-between;font-size:0.8rem;padding:4px 0;color:var(--ink-soft);}
  .metric b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);}
  .assume{font-size:0.76rem;color:var(--muted);line-height:1.55;margin-top:14px;}
  pre.fmt{background:var(--blue-faint);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;overflow-x:auto;}
  @media (max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .period-row{grid-template-columns:repeat(2,1fr);}
    .chart-row,.table-row,.dq-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="eyebrow">MOU Sales Tracker 26-27</div>
      <h1>MOU Dispatch Dashboard</h1>
    </div>
    <div class="meta">
      <div id="updated">loading&hellip;</div>
      <div id="latest"></div>
      <button id="refresh" onclick="loadAll()">REFRESH DATA</button>
    </div>
  </header>
  <div id="notice"></div>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" id="tabBtnDashboard" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab-btn" id="tabBtnCustomers" onclick="switchTab('customers')">All Customers</button>
      <button class="tab-btn" id="tabBtnDiscount" onclick="switchTab('discount')">Discount &amp; Loss</button>
    </div>
    <div class="filters">
      <div class="f"><label>GRADE</label>
        <select id="gradeFilter" onchange="renderCurrentView()">
          <option value="ALL">All grades</option><option>PP</option><option>HDLL</option><option>LDPE</option><option>PVC</option>
        </select></div>
      <div class="f" id="fMonth"><label>MONTH</label>
        <select id="monthFilter" onchange="renderCurrentView()"><option value="ALL">All months</option></select></div>
      <div class="f"><label>CUSTOMER</label>
        <select id="customerFilter" onchange="renderCurrentView()"><option value="ALL">All customers</option></select></div>
      <div class="f" id="fPeriod" style="display:none"><label>PERIOD</label>
        <select id="periodType" onchange="onPeriodTypeChange()">
          <option value="M">Monthly</option><option value="Q">Quarterly</option><option value="H">Half-yearly</option><option value="A">Annual</option>
        </select>
        <select id="periodInst" onchange="renderCurrentView()"></select>
        <label>PP SALE</label>
        <select id="ppSale" onchange="renderCurrentView()"><option value="POST">Non-contract (post-GST)</option><option value="PRE">Contract (pre-GST)</option></select></div>
    </div>
  </div>
  <div id="app"><div class="loading">Loading live sheet data&hellip;</div></div>
</div>

<script>
const SHEET_ID = '1zzDCuyuNP-V1tnpiYmybNhmmjtnKQo1Gc30dOB5DSZQ';
const GRADES = ['PP','HDLL','LDPE','PVC'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const PTYPES = { M:'Monthly', Q:'Quarterly', H:'Half-yearly', A:'Annual' };

let DATA = null;
let currentTab = 'dashboard';
let custSort = { col: 'actual', dir: -1 };
let discSort = { col: 'risk', dir: -1 };

function gvizUrl(sheet){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}&_=${Date.now()}`;
}
async function fetchSheet(name){
  const res = await fetch(gvizUrl(name), { cache: 'no-store' });
  if(!res.ok) throw new Error(`Could not read tab "${name}" (HTTP ${res.status}). Check sharing is set to "Anyone with the link".`);
  const text = await res.text();
  const start = text.indexOf('{'), end = text.lastIndexOf('}');
  const json = JSON.parse(text.substring(start, end+1));
  if(json.status === 'error') throw new Error(`gviz error reading "${name}": ` + (json.errors && json.errors[0] && json.errors[0].detailed_message));
  return (json.table.rows || []).map(r => (r.c || []).map(c => c ? c.v : null));
}
function norm(s){
  let t = String(s==null?'':s).toUpperCase().trim();
  t = t.replace(/[.\-\s]+$/,'').trim();
  return t.replace(/\s+/g,' ');
}
const val = (r,i) => (r[i]===undefined||r[i]===null) ? '' : r[i];
const num = (r,i) => { const n = Number(val(r,i)); return isNaN(n) ? 0 : n; };
const isGrade = g => GRADES.indexOf(g) !== -1;

function parseGvizDate(v){
  if(v===null || v===undefined) return null;
  const s = String(v);
  const m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return new Date(Number(m[1]), Number(m[2]), Number(m[3]));
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function monthKeyOf(d){ return d ? d.getFullYear()*12 + d.getMonth() : null; }
function monthLabelFromKey(mk){ return MONTHS[mk%12] + "'" + String(Math.floor(mk/12)).slice(-2); }
function monthLabelOf(d){ return d ? monthLabelFromKey(monthKeyOf(d)) : 'UNKNOWN'; }
function fmtDate(d){ return String(d.getDate()).padStart(2,'0') + '-' + MONTHS[d.getMonth()] + '-' + d.getFullYear(); }
const todayMK = () => monthKeyOf(new Date());

function findBlock(rows, marker){
  let markerIdx = -1;
  for(let i=0;i<rows.length;i++){
    const v = norm(rows[i][0]);
    if(v.indexOf(marker.toUpperCase()) === 0){ markerIdx = i; break; }
  }
  if(markerIdx === -1) return [];
  const names = [];
  let i = markerIdx + 2;
  while(i < rows.length){
    const v = norm(rows[i][0]);
    if(v === '') break;
    if(v.indexOf('HDLL')===0 || v.indexOf('LDPE')===0) break;
    names.push(rows[i][0]);
    i++;
  }
  return names;
}
function singleBlockNames(rows){
  const names = [];
  for(let i=7;i<rows.length;i++){ if(rows[i][0]) names.push(rows[i][0]); }
  return names;
}

function ensureChartLoaded(){
  return new Promise((resolve, reject) => {
    if (typeof Chart !== 'undefined') return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load the Chart.js library from either CDN. Check your network/ad-blocker.'));
    document.head.appendChild(s);
  });
}

async function loadAll(silent){
  const app = document.getElementById('app');
  if(!silent) app.innerHTML = '<div class="loading">Loading live sheet data&hellip;</div>';
  try{
    await ensureChartLoaded();
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#5F7399';
    const [mouRaw, dispatchRaw, aliasRaw, ppRaw, peRaw, pvcRaw, mwRaw] = await Promise.all([
      fetchSheet('MOU_Master'), fetchSheet('Dispatch_Log'), fetchSheet('Aliases'),
      fetchSheet('MASTERS PP'), fetchSheet('MASTERS PE'), fetchSheet('MASTERS PVC'), fetchSheet('Month_wise')
    ]);

    const aliasMap = {};
    aliasRaw.forEach(r => {
      const raw = val(r,0), canon = val(r,1);
      if(raw && canon && !/^RAW SAP/i.test(String(raw))) aliasMap[norm(raw)] = String(canon).trim();
    });
    const resolve = name => aliasMap[norm(name)] || name;

    // Rows are validated by content (grade must be PP/HDLL/LDPE/PVC) so a header row is never
    // mistaken for data, and a data row is never dropped, however gviz decides to treat headers.
    const mou = mouRaw
      .map(r => ({ name: String(val(r,0)).trim(), grade: String(val(r,1)).trim().toUpperCase(), qty: num(r,4),
                    inMou: String(val(r,6)).trim().toUpperCase(), inDispatch: String(val(r,7)).trim().toUpperCase() }))
      .filter(m => m.name && isGrade(m.grade));

    const dispatch = dispatchRaw.map(r => {
      const dt = parseGvizDate(val(r,0));
      return {
        customer: String(val(r,1)).trim(),
        grade: String(val(r,2)).trim().toUpperCase(),
        qty: num(r,5), date: dt,
        monthKey: monthKeyOf(dt), monthLabel: monthLabelOf(dt)
      };
    }).filter(d => d.customer && isGrade(d.grade));

    const mwRows = mwRaw.filter(r => isGrade(String(val(r,1)).trim().toUpperCase()));

    const nameSet = new Set();
    mou.forEach(m => nameSet.add(norm(m.name)));
    mwRows.forEach(r => { if(val(r,0)) nameSet.add(norm(val(r,0))); });
    singleBlockNames(ppRaw).forEach(n => nameSet.add(norm(n)));
    singleBlockNames(pvcRaw).forEach(n => nameSet.add(norm(n)));
    findBlock(peRaw,'HDLL').forEach(n => nameSet.add(norm(n)));
    findBlock(peRaw,'LDPE').forEach(n => nameSet.add(norm(n)));

    const monthlyTargetMap = {};
    mwRows.forEach(r => {
      const name = String(val(r,0)).trim(), grade = String(val(r,1)).trim().toUpperCase();
      if(name) monthlyTargetMap[grade+'|'+norm(name)] = num(r,3);
    });

    let latestDate = null;
    dispatch.forEach(d => { if(d.date && (!latestDate || d.date > latestDate)) latestDate = d.date; });

    DATA = { mou, dispatch, resolve, nameSet, monthlyTargetMap, latestDate };

    populateFilters();
    updateNotice();
    renderCurrentView();
    document.getElementById('updated').textContent = 'Data pulled: ' + new Date().toLocaleString();
  } catch(err){
    if(silent) return;
    app.innerHTML = `<div class="err"><strong>Could not load data.</strong><br>${err.message}<br><br>
      Make sure the spreadsheet is shared as "Anyone with the link &ndash; Viewer".</div>`;
    document.getElementById('updated').textContent = 'Load failed';
  }
}

function updateNotice(){
  const el = document.getElementById('notice'), L = DATA.latestDate;
  if(!L){ el.innerHTML = ''; document.getElementById('latest').textContent = ''; return; }
  const days = Math.floor((Date.now() - L.getTime()) / 86400000);
  document.getElementById('latest').textContent = 'Latest dispatch in log: ' + fmtDate(L);
  el.innerHTML = days > 7
    ? `<div class="notice"><strong>Dispatch data is ${days} days old.</strong> The newest entry in Dispatch_Log is ${fmtDate(L)}. Import the latest dispatch report in the sheet (MOU Tracker &rarr; Import Pasted Dispatch), then press Refresh data.</div>`
    : '';
}

function keepValue(sel, prev){ if([...sel.options].some(o => o.value === prev)) sel.value = prev; }

function populateFilters(){
  const monthSel = document.getElementById('monthFilter'), custSel = document.getElementById('customerFilter');
  const prevM = monthSel.value, prevC = custSel.value;

  const monthMap = new Map();
  DATA.dispatch.forEach(d => { if(d.monthKey!==null) monthMap.set(d.monthKey, d.monthLabel); });
  const monthKeys = [...monthMap.keys()].sort((a,b)=>a-b);
  monthSel.innerHTML = '<option value="ALL">All months</option>' + monthKeys.map(k => `<option value="${k}">${monthMap.get(k)}</option>`).join('');

  const custSet = new Set();
  DATA.mou.forEach(m => custSet.add(m.name));
  DATA.dispatch.forEach(d => custSet.add(DATA.resolve(d.customer)));
  const custList = [...custSet].sort((a,b)=>a.localeCompare(b));
  custSel.innerHTML = '<option value="ALL">All customers</option>' + custList.map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join('');

  keepValue(monthSel, prevM); keepValue(custSel, prevC);
  populatePeriodOptions();
}

function switchTab(tab){
  currentTab = tab;
  ['dashboard','customers','discount'].forEach(t => {
    document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', tab===t);
  });
  document.getElementById('fMonth').style.display = tab==='discount' ? 'none' : 'flex';
  document.getElementById('fPeriod').style.display = tab==='discount' ? 'flex' : 'none';
  renderCurrentView();
}

const gradeF = () => document.getElementById('gradeFilter').value;
const custF = () => document.getElementById('customerFilter').value;

function getFilteredDispatch(){
  const monthF = document.getElementById('monthFilter').value, g = gradeF(), c = custF();
  return DATA.dispatch.filter(d => {
    if(g !== 'ALL' && d.grade !== g) return false;
    if(monthF !== 'ALL' && String(d.monthKey) !== monthF) return false;
    if(c !== 'ALL' && norm(DATA.resolve(d.customer)) !== norm(c)) return false;
    return true;
  });
}
function getFilteredMou(){
  const g = gradeF(), c = custF();
  return DATA.mou.filter(m => (g==='ALL' || m.grade===g) && (c==='ALL' || norm(m.name)===norm(c)));
}

function renderCurrentView(){
  if(!DATA) return;
  if(currentTab === 'dashboard') renderDashboard();
  else if(currentTab === 'customers') renderCustomers();
  else renderDiscount();
}

function achvPill(a){
  if(a===null) return '<span class="pill neutral">no target</span>';
  const cls = a>=100 ? 'good' : (a>=70 ? 'warn' : 'bad');
  return `<span class="pill ${cls}">${a.toFixed(0)}%</span>`;
}
function fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:1}); }
function inr(n){ return '\u20B9' + Math.round(n).toLocaleString('en-IN'); }

function periodMonthCount(){
  if(document.getElementById('monthFilter').value !== 'ALL') return 1;
  const monthSet = new Set(DATA.dispatch.map(d => d.monthKey).filter(k => k !== null));
  return monthSet.size || 1;
}
function monthlyTargetFor(m){
  const key = m.grade + '|' + norm(m.name);
  return DATA.monthlyTargetMap[key] !== undefined ? DATA.monthlyTargetMap[key] : (m.qty / 12);
}

/* ======================= DASHBOARD TAB ======================= */
function renderDashboard(){
  const dispatch = getFilteredDispatch(), mou = getFilteredMou(), resolve = DATA.resolve, months = periodMonthCount();

  const targetByGrade = {}, actualByGrade = {};
  GRADES.forEach(g => { targetByGrade[g]=0; actualByGrade[g]=0; });
  mou.forEach(m => { targetByGrade[m.grade] += monthlyTargetFor(m) * months; });
  dispatch.forEach(d => { actualByGrade[d.grade] += d.qty; });

  const monthTotals = {}, monthLabelByKey = {};
  dispatch.forEach(d => {
    if(d.monthKey===null) return;
    monthTotals[d.monthKey] = (monthTotals[d.monthKey]||0) + d.qty;
    monthLabelByKey[d.monthKey] = d.monthLabel;
  });
  const monthKeys = Object.keys(monthTotals).map(Number).sort((a,b)=>a-b);

  const custActual = {};
  dispatch.forEach(d => {
    const resolved = resolve(d.customer), key = d.grade + '|' + norm(resolved);
    if(!custActual[key]) custActual[key] = { name: resolved, grade: d.grade, qty: 0 };
    custActual[key].qty += d.qty;
  });
  const ranked = mou.map(m => {
    const actual = custActual[m.grade+'|'+norm(m.name)] ? custActual[m.grade+'|'+norm(m.name)].qty : 0;
    const target = monthlyTargetFor(m) * months;
    return { name: m.name, grade: m.grade, target, actual, achv: target > 0 ? (actual/target)*100 : null };
  }).filter(r => r.target > 0);
  const top5 = [...ranked].sort((a,b)=>b.achv-a.achv).slice(0,5);
  const bottom5 = [...ranked].sort((a,b)=>a.achv-b.achv).slice(0,5);

  const mouNoDispatch = mou.filter(m => !custActual[m.grade+'|'+norm(m.name)])
    .map(m => ({ name: m.name, grade: m.grade, qty: monthlyTargetFor(m) * months })).sort((a,b)=>b.qty-a.qty);

  const orphanGroups = {};
  dispatch.forEach(d => {
    const rn = norm(resolve(d.customer));
    if(!DATA.nameSet.has(rn)){
      const key = d.grade + '|' + rn;
      if(!orphanGroups[key]) orphanGroups[key] = { name: d.customer, grade: d.grade, count: 0 };
      orphanGroups[key].count++;
    }
  });
  const orphans = Object.values(orphanGroups).sort((a,b)=>b.count-a.count);

      { label:'Total dispatch (MT)', data: monthKeys.map(k=>monthTotals[k]), borderColor:'#1F4FBF', backgroundColor:'rgba(76,123,224,0.18)', fill:true, tension:0.3, pointBackgroundColor:'#1F4FBF' } ]},
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'#E4ECF9'}}, x:{grid:{display:false}}} } });

function customerTable(rows){

function dqList(items, nameFn, tagFn){

}

/* ======================= ALL CUSTOMERS TAB ======================= */
function buildCustomerRows(){
  const dispatch = getFilteredDispatch(), resolve = DATA.resolve, months = periodMonthCount(), rowMap = {};
  DATA.mou.forEach(m => {
    rowMap[m.grade+'|'+norm(m.name)] = { name: m.name, grade: m.grade, target: monthlyTargetFor(m)*months, actual: 0, inMou: m.inMou==='Y', inDispatch: false };
  });
  dispatch.forEach(d => {
    const resolved = resolve(d.customer), key = d.grade + '|' + norm(resolved);
    if(!rowMap[key]) rowMap[key] = { name: resolved, grade: d.grade, target: 0, actual: 0, inMou: false, inDispatch: false };
    rowMap[key].actual += d.qty; rowMap[key].inDispatch = true;
  });
  return Object.values(rowMap).map(r => ({ ...r, achv: r.target>0 ? (r.actual/r.target*100) : null }));
}
function renderCustomers(){
  let rows = buildCustomerRows();
  if(custF() !== 'ALL') rows = rows.filter(r => norm(r.name) === norm(custF()));
  if(gradeF() !== 'ALL') rows = rows.filter(r => r.grade === gradeF());

  document.getElementById('app').innerHTML = `
    <div class="view active"><section>

function paintCustomerTable(){
  let rows = window._custRows.slice();

  if(q) rows = rows.filter(r => r.name.toUpperCase().indexOf(q) !== -1);

    || '<tr><td colspan="7" class="empty-note">No matching customers.</td></tr>';
}
function sortCustTable(col){ custSort.dir = (custSort.col===col) ? -custSort.dir : -1; custSort.col = col; paintCustomerTable(); }

/* ======================= DISCOUNT & LOSS TAB ======================= */
// Rates and slabs below come from the DSCD scheme guides (PP, HDPE/LLDPE, LDPE, PVC).
// If RIL or DSCD revise a scheme, edit the numbers here - nothing else needs to change.
const RS = '\u20B9';
// RIL MOU discount: min/max are shares of the ANNUAL MOU quantity; rate is Rs per MT.
const MOU_STD = { M:{min:0.065,max:0.12,rate:700}, Q:{min:0.22,max:0.33,rate:0}, H:{min:0.44,max:0.66,rate:400}, A:{min:0.85,max:1.25,rate:400} };
const MOU_PVC = { M:{min:0.07,max:0.10,rate:700},  Q:{min:0.21,max:0.30,rate:0}, H:{min:0.42,max:0.60,rate:400}, A:{min:0.82,max:1.20,rate:200} };
const MIN_MTA = { PP:0, HDLL:60, LDPE:60, PVC:0 };   // minimum MOU signing quantity (HD/LLDPE/LD: 60 MTA)
// DSCD quantity discount: [from MT per month, Rs per MT]
const QD_SLABS = {
  PP_POST:[[10,200],[21,300],[63,400],[126,500],[189,600],[280,675],[400,750],[550,825],[700,900]],
  PP_PRE: [[10,169],[21,254],[63,339],[126,424],[189,508],[280,572],[400,636],[550,699],[700,763]],
  HDLL:   [[5,450],[10,550],[30,650],[60,750],[100,850],[200,950],[300,1050],[400,1150]],
  LDPE:   [[5,250],[10,350],[30,450],[60,550],[100,650],[200,725],[300,1000],[400,1250]],
  PVC:    [[15,200],[50,300],[100,400],[200,500]]
};
const ruleFor = (grade, pt) => (grade==='PVC' ? MOU_PVC : MOU_STD)[pt];
function qdSlabsFor(grade){
  const key = grade==='PP' ? (document.getElementById('ppSale').value==='PRE' ? 'PP_PRE' : 'PP_POST') : grade;
  return QD_SLABS[key].map(([from, rate]) => ({ from, rate, name: from + '+ MT' }));
}

// Financial year runs April-March. monthKey = year*12 + monthIndex(0-11).
function periodOf(ptype, mk){
  const y = Math.floor(mk/12), m = mk % 12;
  const fy = m >= 3 ? y : y - 1, fm = (m + 9) % 12;
  const fyLabel = 'FY' + String(fy).slice(-2) + '-' + String(fy+1).slice(-2);
  const fyStart = fy*12 + 3;
  if(ptype==='M') return { label: monthLabelFromKey(mk), start: mk, end: mk };
  if(ptype==='Q'){ const q = Math.floor(fm/3), s = fyStart + q*3; return { label: `Q${q+1} ${fyLabel}`, start: s, end: s+2 }; }
  if(ptype==='H'){ const h = Math.floor(fm/6), s = fyStart + h*6; return { label: `H${h+1} ${fyLabel}`, start: s, end: s+5 }; }
  return { label: fyLabel, start: fyStart, end: fyStart+11 };
}
function periodStatus(p){ const t = todayMK(); return t > p.end ? 'closed' : (t >= p.start ? 'open' : 'future'); }

function populatePeriodOptions(){
  const sel = document.getElementById('periodInst');
  if(!DATA || !sel) return;
  const ptype = document.getElementById('periodType').value, prev = sel.value, t = todayMK();
  let minMK = t;
  DATA.dispatch.forEach(d => { if(d.monthKey!==null && d.monthKey < minMK) minMK = d.monthKey; });
  const seen = new Map();
  for(let mk = minMK; mk <= t; mk++){ const p = periodOf(ptype, mk); if(!seen.has(p.start)) seen.set(p.start, p); }
  sel.innerHTML = [...seen.values()].map(p => `<option value="${p.start}">${p.label}</option>`).join('');
  const cur = String(periodOf(ptype, t).start);
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : cur;
}
function onPeriodTypeChange(){ populatePeriodOptions(); renderCurrentView(); }

function evalSlab(slabs, vol){
  let cur = null, next = null;
  for(const s of slabs){ if(vol >= s.from) cur = s; else { next = s; break; } }
  const earned = cur ? vol * cur.rate : 0;
  const uplift = next ? Math.max(0, next.from * next.rate - earned) : 0;
  return { cur, next, earned, need: next ? next.from - vol : 0, uplift };
}

function discountContext(){
  const g = gradeF(), c = custF(), resolve = DATA.resolve, map = {};
  DATA.mou.forEach(m => {
    if(g!=='ALL' && m.grade!==g) return;
    if(c!=='ALL' && norm(m.name)!==norm(c)) return;
    map[m.grade+'|'+norm(m.name)] = { name: m.name, grade: m.grade, annual: m.qty, byMonth: {} };
  });
  DATA.dispatch.forEach(d => {
    if(g!=='ALL' && d.grade!==g) return;
    const res = resolve(d.customer);
    if(c!=='ALL' && norm(res)!==norm(c)) return;
    const key = d.grade+'|'+norm(res);
    if(!map[key]) map[key] = { name: res, grade: d.grade, annual: 0, byMonth: {} };
    if(d.monthKey!==null) map[key].byMonth[d.monthKey] = (map[key].byMonth[d.monthKey]||0) + d.qty;
  });
  return Object.values(map);
}

// One row per customer for one MOU component (Monthly / Quarterly / Half-yearly / Annual) in one period.
function computeMouRows(pt, p, ctx){
  const st = periodStatus(p), rows = [];
  ctx.forEach(c => {
    const rule = ruleFor(c.grade, pt);
    let vol = 0; for(let mk = p.start; mk <= p.end; mk++) vol += c.byMonth[mk] || 0;
    const eligible = c.annual > 0 && c.annual >= MIN_MTA[c.grade];
    const minQty = rule.min * c.annual, maxQty = rule.max * c.annual;
    const qualified = eligible && vol >= minQty - 1e-9;
    const short = eligible && !qualified;
    const payVol = Math.min(vol, maxQty);
    rows.push({ name: c.name, grade: c.grade, annual: c.annual, vol, minQty, maxQty, rate: rule.rate, eligible, qualified, short, st,
      pct: c.annual > 0 ? vol / c.annual * 100 : null,
      need: short && st==='open' ? minQty - vol : 0,
      earned: qualified ? rule.rate * payVol : 0,
      atRisk: short && st==='open' ? rule.rate * payVol : 0,
      forgone: short && st==='closed' ? rule.rate * payVol : 0 });
  });
  return rows;
}
const sum = (rows, k) => rows.reduce((a,r) => a + (r[k]||0), 0);
const pc = x => (+(x*100).toFixed(1)) + '%';

function ruleText(pt){
  const g = gradeF(), s = MOU_STD[pt], v = MOU_PVC[pt];
  const rate = r => r.rate ? `${RS}${r.rate}/MT` : `${RS}0/MT (no payout)`;
  const std = `${rate(s)} &middot; ${pc(s.min)}&ndash;${pc(s.max)} of MOU`;
  if(g==='PVC') return `${rate(v)} &middot; ${pc(v.min)}&ndash;${pc(v.max)} of MOU`;
  if(g==='ALL') return std + ` <br>PVC: ${pc(v.min)}&ndash;${pc(v.max)}${v.rate!==s.rate ? ', ' + RS + v.rate + '/MT' : ''}`;
  return std;
}

// Financial-year-to-date totals across all four MOU components, plus DSCD quantity discount.
function fyTotals(ctx){
  const t = todayMK(), fy = periodOf('A', t), out = { earned:0, atRisk:0, forgone:0, byType:{}, qd:0, noMouMT:0 };
  Object.keys(PTYPES).forEach(pt => {
    const agg = { earned:0, atRisk:0, forgone:0 }, seen = new Set();
    for(let mk = fy.start; mk <= t; mk++){
      const p = periodOf(pt, mk); if(seen.has(p.start)) continue; seen.add(p.start);
      const rows = computeMouRows(pt, p, ctx);
      agg.earned += sum(rows,'earned'); agg.atRisk += sum(rows,'atRisk'); agg.forgone += sum(rows,'forgone');
    }
    out.byType[pt] = agg; out.earned += agg.earned; out.atRisk += agg.atRisk; out.forgone += agg.forgone;
  });
  ctx.forEach(c => {
    const slabs = qdSlabsFor(c.grade);
    for(let mk = fy.start; mk <= t; mk++){
      const v = c.byMonth[mk] || 0; if(v <= 0) continue;
      out.qd += evalSlab(slabs, v).earned;
      if(!c.annual) out.noMouMT += v;
    }
  });
  return out;
}

function statusPill(r){
  if(!r.eligible) return r.annual > 0 ? `<span class="pill neutral">Below ${MIN_MTA[r.grade]} MTA</span>` : '<span class="pill neutral">No MOU</span>';
  if(r.qualified) return '<span class="pill good">Qualified</span>';
  if(r.st==='open') return '<span class="pill warn">Short</span>';
  return '<span class="pill bad">Missed</span>';
}

function renderDiscount(){
  const app = document.getElementById('app');
  const pt = document.getElementById('periodType').value;
  const p = periodOf(pt, Number(document.getElementById('periodInst').value) || todayMK());
  const st = periodStatus(p), ctx = discountContext(), rows = computeMouRows(pt, p, ctx);
  const elig = rows.filter(r => r.eligible), qual = elig.filter(r => r.qualified).length;
  const earned = sum(rows,'earned'), atRisk = sum(rows,'atRisk'), forgone = sum(rows,'forgone'), needTotal = sum(rows,'need');
  const statusPillHtml = st==='open' ? '<span class="pill warn">running</span>' : (st==='closed' ? '<span class="pill neutral">closed</span>' : '<span class="pill neutral">not started</span>');
  const noPayout = !!(rows.length && rows.every(r => !r.rate));

  const kpis = `
    <div class="kpi overall"><div class="grade">MOU discount earned</div><div class="achv">${inr(earned)}</div><div class="figs">${PTYPES[pt]} &middot; ${p.label}</div></div>
    <div class="kpi"><div class="grade">Discount at risk</div><div class="achv">${st==='open' ? inr(atRisk) : '&mdash;'}</div><div class="figs">${st==='open' ? 'lost if minimum not reached' : 'running period only'}</div></div>
    <div class="kpi"><div class="grade">Discount forgone</div><div class="achv">${st==='closed' ? inr(forgone) : '&mdash;'}</div><div class="figs">${st==='closed' ? 'minimum missed, not paid' : 'closed period only'}</div></div>
    <div class="kpi"><div class="grade">Qualified</div><div class="achv">${qual} / ${elig.length}</div><div class="figs">MOU customers meeting the minimum</div></div>
    <div class="kpi"><div class="grade">Volume to qualify</div><div class="achv">${st==='open' ? fmt(needTotal) : '&mdash;'}</div><div class="figs">${st==='open' ? 'MT still needed, all short customers' : 'running period only'}</div></div>`;

  const fy = fyTotals(ctx), fyLabel = periodOf('A', todayMK()).label;
  const fyRows = Object.keys(PTYPES).map(t => `<tr><td>${PTYPES[t]}</td><td class="num">${inr(fy.byType[t].earned)}</td><td class="num">${inr(fy.byType[t].atRisk)}</td><td class="num">${inr(fy.byType[t].forgone)}</td></tr>`).join('');

  const panels = Object.keys(PTYPES).map(t => {
    const cp = periodOf(t, todayMK()), cr = computeMouRows(t, cp, ctx), el = cr.filter(r => r.eligible), q = el.filter(r => r.qualified).length;
    return `<div class="panel"><div class="eyebrow">${PTYPES[t]}</div><h3>${cp.label} <span class="pill warn">running</span></h3>
      <div class="count-note">${ruleText(t)}</div>
      <div class="metric"><span>Qualified</span><b>${q} / ${el.length}</b></div>
      <div class="metric"><span>Earned</span><b>${inr(sum(cr,'earned'))}</b></div>
      <div class="metric"><span>At risk</span><b>${inr(sum(cr,'atRisk'))}</b></div>
      <div class="metric"><span>MT to qualify</span><b>${fmt(sum(cr,'need'))}</b></div></div>`;
  }).join('');

  const closest = rows.filter(r => r.short && st==='open').sort((a,b) => a.need - b.need).slice(0,8);
  const closestHtml = st!=='open' ? '<div class="empty-note">Shown for running periods only.</div>'
    : (closest.length ? closest.map(r => `<div class="dq-item"><span class="name">${r.name} <span class="tag">(${r.grade})</span></span><span class="tag">${fmt(r.need)} MT &middot; ${r.rate ? 'unlocks ' + inr(r.rate * Math.min(Math.max(r.vol, r.minQty), r.maxQty)) : 'no payout'}</span></div>`).join('')
      : '<div class="empty-note">No customer is short of the minimum.</div>');

  // DSCD quantity discount is monthly: use the selected month, or the latest month of a longer period.
  const qdMk = pt==='M' ? p.start : Math.min(p.end, todayMK());
  const qdRows = [];
  ctx.forEach(c => {
    const v = c.byMonth[qdMk] || 0; if(v <= 0) return;
    const e = evalSlab(qdSlabsFor(c.grade), v);
    qdRows.push({ name: c.name, grade: c.grade, vol: v, cur: e.cur, next: e.next, need: e.need, earned: e.earned, upside: e.uplift });
  });
  qdRows.sort((a,b) => b.earned - a.earned);
  const qdHtml = qdRows.length ? qdRows.map(r => `<tr><td>${r.name}</td><td>${r.grade}</td><td class="num">${fmt(r.vol)}</td>
      <td>${r.cur ? `<span class="pill good">${r.cur.name} &middot; ${RS}${r.cur.rate}</span>` : '<span class="pill neutral">below first slab</span>'}</td>
      <td class="num">${inr(r.earned)}</td>
      <td>${r.next ? `${r.next.name} <span class="tag">@ ${RS}${r.next.rate}</span>` : '<span class="tag">top slab</span>'}</td>
      <td class="num">${r.next ? fmt(r.need) : '&mdash;'}</td>
      <td class="num">${r.next ? inr(r.upside) : '&mdash;'}</td></tr>`).join('')
    : `<tr><td colspan="8" class="empty-note">No dispatch recorded in ${monthLabelFromKey(qdMk)} for these filters.</td></tr>`;

  app.innerHTML = `
    <div class="view active">
      <section><div class="eyebrow">Selected period</div><h2>RIL MOU discount &middot; ${PTYPES[pt]} &middot; ${p.label} ${statusPillHtml}</h2>
        <div class="count-note">${ruleText(pt)}${noPayout ? ' &mdash; this component pays nothing under the scheme, so it is tracked for status only.' : ''}</div>
        <div class="kpi-row">${kpis}</div></section>

      <section><div class="eyebrow">Financial year to date</div><h2>${fyLabel} &middot; all four MOU components</h2>
        <div class="table-row">
          <div class="panel"><div class="tbl-scroll"><table><thead><tr><th>Component</th><th style="text-align:right">Earned</th><th style="text-align:right">At risk</th><th style="text-align:right">Forgone</th></tr></thead><tbody>
            ${fyRows}
            <tr><td><b>Total</b></td><td class="num"><b>${inr(fy.earned)}</b></td><td class="num"><b>${inr(fy.atRisk)}</b></td><td class="num"><b>${inr(fy.forgone)}</b></td></tr>
          </tbody></table></div></div>
          <div class="panel">
            <div class="metric"><span>DSCD quantity discount given (FY to date)</span><b>${inr(fy.qd)}</b></div>
            <div class="metric"><span>Lifted with no MOU on file (MT)</span><b>${fmt(fy.noMouMT)}</b></div>
            <div class="assume">Customers who lift without an MOU are not eligible for any RIL MOU discount on that volume. At risk and forgone are counted on volume actually lifted.</div>
          </div>
        </div></section>

      <section><div class="eyebrow">Slab status</div><h2>Current period of every cycle</h2>
        <div class="period-row">${panels}</div></section>

      <section><div class="chart-row">
        <div class="panel"><h3>MOU discount by grade (${p.label})</h3><canvas id="discChart"></canvas></div>
        <div class="panel"><h3>Closest to qualifying</h3>${closestHtml}</div>
      </div></section>

      <section><div class="eyebrow">Detail</div><h2>Customer MOU status &middot; ${p.label}</h2>
        <div class="count-note" id="discCount"></div>
        <div class="panel"><div class="tbl-scroll"><table><thead><tr>
          <th class="sortable" onclick="sortDisc('name')">Customer</th>
          <th class="sortable" onclick="sortDisc('grade')">Grade</th>
          <th class="sortable" onclick="sortDisc('annual')" style="text-align:right">Annual MOU</th>
          <th class="sortable" onclick="sortDisc('minQty')" style="text-align:right">Minimum (MT)</th>
          <th class="sortable" onclick="sortDisc('vol')" style="text-align:right">Lifted (MT)</th>
          <th class="sortable" onclick="sortDisc('pct')" style="text-align:right">% of MOU</th>
          <th>Status</th>
          <th class="sortable" onclick="sortDisc('need')" style="text-align:right">MT to qualify</th>
          <th class="sortable" onclick="sortDisc('earned')" style="text-align:right">Earned</th>
          <th class="sortable" onclick="sortDisc('atRisk')" style="text-align:right">At risk</th>
          <th class="sortable" onclick="sortDisc('forgone')" style="text-align:right">Forgone</th>
        </tr></thead><tbody id="discBody"></tbody></table></div></div></section>

      <section><div class="eyebrow">DSCD scheme</div><h2>Quantity discount &middot; ${monthLabelFromKey(qdMk)}</h2>
        <div class="count-note">Monthly slabs on total quantity lifted${pt!=='M' ? ' (latest month of the selected period shown)' : ''}. ${gradeF()==='PP' || gradeF()==='ALL' ? 'PP trade discount uses the sale type chosen in the PP SALE filter.' : ''}</div>
        <div class="panel"><div class="tbl-scroll"><table><thead><tr>
          <th>Customer</th><th>Grade</th><th style="text-align:right">Lifted (MT)</th><th>Current slab</th><th style="text-align:right">Discount</th><th>Next slab</th><th style="text-align:right">MT to next</th><th style="text-align:right">Extra if reached</th>
        </tr></thead><tbody>${qdHtml}</tbody></table></div></div>
        <div class="assume"><b>How this is calculated.</b> Periods follow the April&ndash;March financial year. A customer qualifies for a MOU component by lifting at least the minimum share of annual MOU quantity in that period. Discount = rate &times; volume lifted, capped at the maximum share, and paid only if the minimum is met. At risk = that discount on volume lifted so far in a running period that is still short of the minimum. Forgone = the same amount once the period has closed short. HDPE/LLDPE and LDPE customers with an annual MOU under 60 MT are not eligible. Cash discount, early-payment incentive, cut &amp; torn bag, depot, deemed-export and special RIL schemes are not included because the sheet holds no payment, billing or depot data.</div>
      </section>
    </div>`;

  window._discRows = rows;
  paintDiscTable();

  const byGrade = g => rows.filter(r => r.grade===g);
  new Chart(document.getElementById('discChart'), { type:'bar',
    data:{ labels: GRADES, datasets:[
      { label:'Earned', data: GRADES.map(g=>sum(byGrade(g),'earned')), backgroundColor:'#1F4FBF', borderRadius:5 },
      { label:'At risk', data: GRADES.map(g=>sum(byGrade(g),'atRisk')), backgroundColor:'#E3A94A', borderRadius:5 },
      { label:'Forgone', data: GRADES.map(g=>sum(byGrade(g),'forgone')), backgroundColor:'#C9564B', borderRadius:5 } ]},
    options:{ responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, grid:{color:'#E4ECF9'}}, x:{grid:{display:false}}} } });
}
function paintDiscTable(){
  const rows = window._discRows.slice(), { col, dir } = discSort;
  const keyOf = r => col==='risk' ? (r.atRisk + r.forgone) : r[col];
  rows.sort((a,b) => { const av = keyOf(a), bv = keyOf(b); return (typeof av==='string' ? av.localeCompare(bv) : ((av==null?-1:av) - (bv==null?-1:bv))) * dir; });
  document.getElementById('discCount').textContent = rows.length + ' customer(s)';
  document.getElementById('discBody').innerHTML = rows.map(r => `
    <tr><td>${r.name}</td><td>${r.grade}</td>
    <td class="num">${r.annual ? fmt(r.annual) : '&mdash;'}</td>
    <td class="num">${r.eligible ? fmt(r.minQty) : '&mdash;'}</td>
    <td class="num">${fmt(r.vol)}</td>
    <td class="num">${r.pct===null ? '&mdash;' : r.pct.toFixed(1) + '%'}</td>
    <td>${statusPill(r)}</td>
    <td class="num">${r.need ? fmt(r.need) : '&mdash;'}</td>
    <td class="num">${r.earned ? inr(r.earned) : '&mdash;'}</td>
    <td class="num">${r.atRisk ? `<span style="color:var(--amber)">${inr(r.atRisk)}</span>` : '&mdash;'}</td>
    <td class="num">${r.forgone ? `<span style="color:var(--red)">${inr(r.forgone)}</span>` : '&mdash;'}</td></tr>`).join('')
    || '<tr><td colspan="11" class="empty-note">No customers match these filters.</td></tr>';
}
function sortDisc(col){ discSort.dir = (discSort.col===col) ? -discSort.dir : -1; discSort.col = col; paintDiscTable(); }

loadAll();
setInterval(() => { if(!document.hidden) loadAll(true); }, 10 * 60 * 1000); // quiet auto-refresh every 10 min
</script>
</body>
</html>
